<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="">
<title>Footworn</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="field">
<a class="skip" href="#places">Skip to the sites</a>
<canvas id="scene" role="img" aria-label="A snowfield where every visit leaves footprints"></canvas>

<section id="gate" class="gate glass" hidden>
  <h1>Footworn</h1>
  <p class="muted">The dashboard needs the admin token (the Worker’s <code translate="no">ADMIN_TOKEN</code> secret).</p>
  <form id="gate-form">
    <label for="token" class="sr-only">Token</label>
    <input id="token" name="token" type="password" placeholder="Paste the admin token…" autocomplete="current-password" spellcheck="false" required>
    <button class="btn" type="submit">Open</button>
  </form>
  <p id="gate-error" class="error" role="alert" hidden></p>
</section>

<div id="ui" hidden>
  <header class="hud glass">
    <button class="btn" id="back" type="button" hidden aria-label="Back to the valley">← Valley</button>
    <div class="who">
      <p class="eyebrow">Footworn</p>
      <h1 id="title">Your sites</h1>
      <p id="sub" class="sub"></p>
    </div>
  </header>

  <section class="stats glass" aria-label="Today">
    <div><b class="num" id="s-visitors">–</b><span>visitors today</span></div>
    <div><b class="num" id="s-hits">–</b><span>pageviews</span></div>
    <div class="live" id="s-live-box" data-state="connecting"><b class="num"><i aria-hidden="true"></i><span id="s-live">–</span></b><span id="s-live-label">live · last 5 min</span></div>
  </section>

  <nav class="dock glass" aria-label="Sites and tools">
    <ul id="places" class="places"></ul>
    <span class="grow"></span>
    <button class="btn" id="toggle-visits" type="button" aria-controls="visits" aria-pressed="true">Visits</button>
    <button class="btn" id="open-ledger" type="button" hidden aria-controls="ledger">Ledger</button>
    <button class="btn" id="theme" type="button">Dark</button>
    <button class="btn" id="logout" type="button" title="Forget the token">Lock</button>
  </nav>

  <aside id="visits" class="visits glass" aria-labelledby="visits-title" hidden>
    <header class="visits-head">
      <h2 id="visits-title"><button type="button" id="visits-fold" class="fold" aria-expanded="false" aria-controls="visits-list"><i aria-hidden="true"></i>Today’s visits</button></h2>
      <p id="visits-count" class="sub">–</p>
      <div class="filters" id="visits-filters" role="group" aria-label="Show">
        <button type="button" aria-pressed="true" data-f="all">All</button>
        <button type="button" aria-pressed="false" data-f="first">First pages</button>
        <button type="button" aria-pressed="false" data-f="events">Events</button>
        <button type="button" aria-pressed="false" data-f="phones">Phones</button>
      </div>
    </header>
    <ol id="visits-list" class="visits-list" role="log" aria-label="Today’s visits, newest first"></ol>
    <button type="button" class="btn more" id="visits-more" hidden>Show more</button>
  </aside>

  <p id="error" class="error glass banner" role="alert" hidden></p>

  <aside id="ledger" class="ledger" hidden aria-labelledby="ledger-title">
    <header class="top">
      <h2 id="ledger-title" class="ledger-title">Ledger</h2>
      <span class="grow"></span>
      <button class="btn" id="close-ledger" type="button">Close</button>
    </header>
    <div class="top">
      <span class="seg" id="ranges" role="group" aria-label="Range">
        <button class="btn" data-days="1" type="button">1 d</button>
        <button class="btn" data-days="7" type="button">7 d</button>
        <button class="btn" data-days="30" type="button" aria-pressed="true">30 d</button>
        <button class="btn" data-days="90" type="button">90 d</button>
      </span>
      <span class="seg dates">
        <input id="from" name="from" type="date" aria-label="From" autocomplete="off">
        <input id="to" name="to" type="date" aria-label="To" autocomplete="off">
      </span>
    </div>

    <p id="ledger-error" class="error" role="alert" hidden></p>

    <div class="tiles" id="content" aria-live="polite">
      <div class="tile"><div class="k">Visitors</div><div class="v num" id="t-visitors">–</div><div class="u num" id="u-visitors"></div></div>
      <div class="tile"><div class="k">Pageviews</div><div class="v num" id="t-hits">–</div><div class="u num" id="u-hits"></div></div>
      <div class="tile"><div class="k">Events</div><div class="v num" id="t-events">–</div><div class="u num" id="u-events"></div></div>
    </div>

    <div class="chart">
      <h2>By day</h2>
      <div id="chart"></div>
    </div>

    <div class="grid rhythm" id="rhythm"></div>

    <div class="grid" id="tables"></div>

    <section id="detail" class="panel detail" hidden></section>
  </aside>
</div>

<div id="tip" class="tip glass" role="tooltip" hidden></div>

<script src="scene.js"></script>
<script src="live.js"></script>
<script src="ledger.js"></script>
<script src="visits.js"></script>
<script src="app.js"></script>
</body>
</html>
